services:
  - type: web
    name: discord-login
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: CLIENT_ID
        sync: false
      - key: HOOK
        sync: false
